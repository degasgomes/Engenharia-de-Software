services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: featureflow
      POSTGRES_USER: featureflow
      POSTGRES_PASSWORD: featureflow
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featureflow -d featureflow"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      POSTGRES_DB: featureflow
      POSTGRES_USER: featureflow
      POSTGRES_PASSWORD: featureflow
      POSTGRES_HOST: db
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dados_db:
