# M-06: lint e testes em cada pull request (RNF-09)
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: featureflow
          POSTGRES_USER: featureflow
          POSTGRES_PASSWORD: featureflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U featureflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: featureflow
      POSTGRES_USER: featureflow
      POSTGRES_PASSWORD: featureflow
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrações em falta
        run: python manage.py makemigrations --check --dry-run
      - name: Testes
        run: pytest -q
      - name: Dados de exemplo
        run: python manage.py migrate --noinput && python manage.py loaddata dados_exemplo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
